<html lang="th">
<head>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="รอบเดือน">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="description" content="บันทึกประจำเดือน อาการ และดูช่วงประมาณการรอบถัดไป">
  <!-- แอป PWA ระบบบันทึกรอบเดือนสตรี ชุดไฟล์ 20261028-130002 ระบบเวอร์ชัน 1.1.0 -->
  <base target="_top">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#FFF7F5">
  <title>ระบบบันทึกรอบเดือนสตรี</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@400;500;600;700&family=Sarabun:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
/* =====================================================================
   ระบบบันทึกรอบเดือนสตรี — Minimal Pastel Dashboard (Thai public service)
   ===================================================================== */
:root{
  --bg:#FFF7F5; --surface:#FFFFFF; --surface-2:#FFFBFA; --ink:#2E2541; --ink-2:#4A4060; --muted:#7B7091; --line:#F1E3EA; --line-2:#E8D6E0;
  --primary:#E879A6; --primary-ink:#B2457A; --primary-soft:#FDE7F0;
  --lav:#9C86E0; --lav-soft:#EFE9FF; --mint:#3FA883; --mint-soft:#E2F7EE; --peach:#E88A4E; --peach-soft:#FFEEDF; --sky:#4F8FD6; --sky-soft:#E3F0FF; --lemon:#C79A16; --lemon-soft:#FFF6D6;
  --danger:#D64562; --danger-soft:#FDE4EA; --warn:#C9781A; --warn-soft:#FFF0DD; --ok:#2F9E77;
  --g-rose:linear-gradient(135deg,#FFD9E6 0%,#FFB9D0 100%);
  --g-lav:linear-gradient(135deg,#ECE4FF 0%,#D2C2FA 100%);
  --g-mint:linear-gradient(135deg,#DBF7EC 0%,#ADE8D2 100%);
  --g-peach:linear-gradient(135deg,#FFE9D7 0%,#FFCBA8 100%);
  --g-sky:linear-gradient(135deg,#DFEFFF 0%,#B7D8FF 100%);
  --g-lemon:linear-gradient(135deg,#FFF7D4 0%,#FFE8A0 100%);
  --g-primary:linear-gradient(135deg,var(--primary) 0%,#B98BE8 100%);
  --shadow-sm:0 2px 8px rgba(120,80,130,.06);
  --shadow:0 10px 30px rgba(120,80,130,.09),0 2px 6px rgba(120,80,130,.05);
  --shadow-lg:0 24px 60px rgba(110,70,120,.16);
  --r-sm:12px; --r:18px; --r-lg:26px; --r-pill:999px;
  --sb-w:276px; --top-h:68px;
  --font-body:'Sarabun',system-ui,-apple-system,'Segoe UI',sans-serif;
  --font-head:'Prompt','Sarabun',system-ui,sans-serif;
  --ease:cubic-bezier(.2,.8,.2,1);
  --fs:1;
}
*{box-sizing:border-box}
html{font-size:calc(16px * var(--fs));-webkit-text-size-adjust:100%}
body{margin:0;font-family:var(--font-body);color:var(--ink);background:var(--bg);line-height:1.6;min-height:100vh;-webkit-font-smoothing:antialiased;overflow-x:hidden}
h1,h2,h3,h4{font-family:var(--font-head);font-weight:600;line-height:1.3;margin:0 0 .4em;color:var(--ink)}
h1{font-size:1.6rem}h2{font-size:1.25rem}h3{font-size:1.06rem}h4{font-size:.98rem}
p{margin:0 0 .7em}
a{color:var(--primary-ink)}
small,.small{font-size:.86rem}
.muted{color:var(--muted)}
.hidden,[hidden]{display:none!important}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid color-mix(in srgb,var(--primary) 55%,white);outline-offset:2px;border-radius:8px}
::selection{background:var(--primary-soft)}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ---------- background layer (login + personal theme) */
#bg-layer{position:fixed;inset:0;z-index:-2;background:var(--bg);background-size:cover;background-position:center;transition:background .4s}
#bg-dim{position:fixed;inset:0;z-index:-1;pointer-events:none;background:rgba(255,255,255,0)}
.bg-aurora{background:radial-gradient(1200px 600px at 10% -10%,#FFE0EC 0%,transparent 60%),radial-gradient(900px 600px at 110% 10%,#E9E1FF 0%,transparent 55%),radial-gradient(900px 700px at 50% 120%,#DDF6EC 0%,transparent 60%),#FFF7F5!important}
.bg-cream{background:#FFF7F5!important}
.bg-blush{background:linear-gradient(160deg,#FFF1F5 0%,#FFE1EB 100%)!important}
.bg-lavender{background:linear-gradient(160deg,#F7F3FF 0%,#E7DDFF 100%)!important}
.bg-mint{background:linear-gradient(160deg,#F2FCF7 0%,#D8F4E7 100%)!important}
.bg-sky{background:linear-gradient(160deg,#F2F8FF 0%,#DAEBFF 100%)!important}
.bg-peach{background:linear-gradient(160deg,#FFF6EF 0%,#FFE2CC 100%)!important}
.bg-sunset{background:linear-gradient(160deg,#FFF0F3 0%,#FFE6D6 50%,#F1E6FF 100%)!important}

/* ---------- top progress + boot */
#topProgress{position:fixed;top:0;left:0;height:3px;width:0;z-index:9999;background:var(--g-primary);transition:width .3s var(--ease),opacity .3s;opacity:0;border-radius:0 3px 3px 0}
#topProgress.on{opacity:1}
#boot-screen{position:fixed;inset:0;display:grid;place-items:center;z-index:50;background:var(--bg)}
.boot-inner{text-align:center}
.boot-moon{width:72px;height:72px;margin:0 auto 14px;animation:floaty 2.4s ease-in-out infinite}
.boot-text{font-family:var(--font-head);color:var(--muted)}
@keyframes floaty{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes pop{0%{transform:scale(.96);opacity:0}100%{transform:scale(1);opacity:1}}
@keyframes rise{0%{transform:translateY(10px);opacity:0}100%{transform:none;opacity:1}}
@keyframes slideIn{0%{transform:translateX(24px);opacity:0}100%{transform:none;opacity:1}}
@keyframes blink{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.1)}}

/* ---------- buttons */
.btn{--b-bg:var(--surface);--b-ink:var(--ink);display:inline-flex;align-items:center;justify-content:center;gap:.5em;min-height:44px;padding:.55em 1.15em;border-radius:14px;border:1px solid var(--line-2);background:var(--b-bg);color:var(--b-ink);font-family:var(--font-head);font-weight:500;font-size:.96rem;cursor:pointer;text-decoration:none;white-space:nowrap;transition:transform .18s var(--ease),box-shadow .18s var(--ease),background .18s,filter .18s;user-select:none;-webkit-tap-highlight-color:transparent}
.btn:hover{transform:translateY(-1px);box-shadow:var(--shadow-sm)}
.btn:active{transform:translateY(0) scale(.97)}
.btn[disabled],.btn.is-busy{opacity:.6;pointer-events:none}
.btn.is-busy::after{content:"";width:1em;height:1em;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;animation:spin .7s linear infinite}
.btn-primary{border:0;background:var(--g-primary);color:#fff;box-shadow:0 8px 20px color-mix(in srgb,var(--primary) 32%,transparent)}
.btn-primary:hover{box-shadow:0 12px 26px color-mix(in srgb,var(--primary) 40%,transparent);filter:saturate(1.08)}
.btn-soft{border:0;background:var(--primary-soft);color:var(--primary-ink)}
.btn-ghost{border-color:transparent;background:transparent}
.btn-ghost:hover{background:rgba(255,255,255,.7)}
.btn-danger{border:0;background:var(--danger-soft);color:var(--danger)}
.btn-danger.solid{background:var(--danger);color:#fff}
.btn-sm{min-height:36px;padding:.35em .85em;font-size:.88rem;border-radius:11px}
.btn-xs{min-height:30px;padding:.2em .6em;font-size:.82rem;border-radius:9px}
.btn-block{width:100%}
.btn-icon{width:42px;min-height:42px;padding:0;border-radius:12px}
.btn-google{border:1px solid #E3DCE6;background:#fff;color:#3c3c3c;font-weight:500}
.btn-google svg{width:20px;height:20px}
.link-btn{background:none;border:0;padding:0;color:var(--primary-ink);font-weight:600;cursor:pointer;text-decoration:underline;text-underline-offset:3px}

/* ---------- forms */
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}
.field>label,.field-label{font-weight:600;font-size:.94rem;color:var(--ink-2)}
.field .hint{font-size:.84rem;color:var(--muted);margin-top:-2px}
.field .err{font-size:.85rem;color:var(--danger);min-height:0}
.req::after{content:" *";color:var(--danger)}
.input,select.input,textarea.input{width:100%;min-height:46px;padding:.6em .85em;border-radius:12px;border:1.5px solid var(--line-2);background:var(--surface);font-size:16px;transition:border-color .2s,box-shadow .2s;appearance:none;-webkit-appearance:none}
select.input{background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 18px) 55%,calc(100% - 13px) 55%;background-size:5px 5px;background-repeat:no-repeat;padding-right:2.2em}
textarea.input{min-height:90px;resize:vertical}
.input:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 4px color-mix(in srgb,var(--primary) 16%,transparent)}
.input.invalid{border-color:var(--danger)}
.input-wrap{position:relative}
.input-wrap .input{padding-right:3em}
.input-wrap .eye{position:absolute;right:6px;top:50%;transform:translateY(-50%);width:38px;height:38px;border:0;background:transparent;border-radius:10px;cursor:pointer;font-size:1.1rem}
.input-wrap .eye:hover{background:var(--primary-soft)}
.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 16px}
.form-grid .full{grid-column:1/-1}
.check{display:flex;gap:10px;align-items:flex-start;cursor:pointer;font-size:.94rem;line-height:1.5;margin:6px 0}
.check input{width:20px;height:20px;margin-top:2px;accent-color:var(--primary);flex:none}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip-opt{position:relative}
.chip-opt input{position:absolute;opacity:0;pointer-events:none}
.chip-opt span{display:inline-flex;align-items:center;gap:6px;min-height:38px;padding:.3em .9em;border-radius:var(--r-pill);border:1.5px solid var(--line-2);background:var(--surface);cursor:pointer;font-size:.92rem;transition:all .16s var(--ease)}
.chip-opt span:hover{border-color:var(--primary)}
.chip-opt input:checked+span{background:var(--primary-soft);border-color:var(--primary);color:var(--primary-ink);font-weight:600}
.chip-opt input:focus-visible+span{outline:3px solid color-mix(in srgb,var(--primary) 50%,white);outline-offset:2px}
.range-row{display:flex;align-items:center;gap:12px}
.range-row input[type=range]{flex:1;accent-color:var(--primary);height:28px}
.range-val{min-width:7.5em;text-align:right;font-weight:600;color:var(--primary-ink);font-size:.92rem}
.strength{height:6px;border-radius:6px;background:var(--line);overflow:hidden;margin-top:6px}
.strength i{display:block;height:100%;width:0;border-radius:6px;transition:width .3s,background .3s}
.form-actions{display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap;margin-top:8px}
.thumbs{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}
.thumb{position:relative;width:72px;height:72px;border-radius:12px;overflow:hidden;background:var(--surface-2);border:1px solid var(--line)}
.thumb img{width:100%;height:100%;object-fit:cover;cursor:zoom-in}
.thumb button{position:absolute;top:3px;right:3px;width:24px;height:24px;border-radius:50%;border:0;background:rgba(46,37,65,.75);color:#fff;cursor:pointer;font-size:.8rem;line-height:1}

/* ---------- auth screens */
#auth{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:32px 16px 24px}
.brand{text-align:center;margin-bottom:22px;animation:rise .5s var(--ease)}
.brand-logo{width:92px;height:92px;margin:0 auto 12px;border-radius:28px;background:var(--surface);box-shadow:var(--shadow);display:grid;place-items:center;overflow:hidden}
.brand-logo img,.brand-logo svg{width:100%;height:100%;object-fit:contain}
.brand-name{font-family:var(--font-head);font-weight:700;font-size:1.55rem;color:var(--ink);margin:0}
.brand-sub{color:var(--muted);margin:.2em 0 0}
.auth-card{width:100%;max-width:440px;background:rgba(255,255,255,.92);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-radius:var(--r-lg);box-shadow:var(--shadow-lg);padding:28px 26px;border:1px solid rgba(255,255,255,.8);animation:pop .45s var(--ease)}
.auth-card.wide{max-width:620px}
.auth-card h2{text-align:center;margin-bottom:4px}
.auth-card .lead{text-align:center;color:var(--muted);margin-bottom:18px}
.auth-row{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin:2px 0 14px}
.divider{display:flex;align-items:center;gap:12px;color:var(--muted);font-size:.88rem;margin:16px 0}
.divider::before,.divider::after{content:"";flex:1;height:1px;background:var(--line-2)}
.auth-switch{text-align:center;margin-top:16px;font-size:.95rem}
.auth-foot{margin-top:22px;text-align:center;color:var(--muted);font-size:.84rem}
.auth-foot button{background:none;border:0;color:var(--muted);text-decoration:underline;cursor:pointer;font-size:.84rem}
.notice{border-radius:14px;padding:12px 14px;margin-bottom:14px;font-size:.92rem;display:flex;gap:10px;align-items:flex-start}
.notice.info{background:var(--sky-soft);color:#2b5b8f}
.notice.ok{background:var(--mint-soft);color:#1f6b51}
.notice.warn{background:var(--warn-soft);color:#7a4a10}
.notice.err{background:var(--danger-soft);color:#8f2238}

/* ---------- app shell */
#app{min-height:100vh}
#sidebar{position:fixed;inset:0 auto 0 0;width:var(--sb-w);background:rgba(255,255,255,.94);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-right:1px solid var(--line);display:flex;flex-direction:column;z-index:40;transition:transform .3s var(--ease)}
.sb-brand{padding:22px 18px 14px;text-align:center;border-bottom:1px solid var(--line)}
.sb-logo{width:68px;height:68px;margin:0 auto 10px;border-radius:22px;background:var(--surface);box-shadow:var(--shadow-sm);overflow:hidden;display:grid;place-items:center;position:relative;cursor:pointer;border:0;padding:0}
.sb-logo img,.sb-logo svg{width:100%;height:100%;object-fit:contain}
.sb-logo .edit-badge{position:absolute;right:2px;bottom:2px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:var(--shadow-sm);font-size:.7rem;display:grid;place-items:center;opacity:0;transition:opacity .2s}
.sb-logo:hover .edit-badge,.sb-logo:focus-visible .edit-badge{opacity:1}
.sb-title-row{display:flex;align-items:center;justify-content:center;gap:4px}
.sb-title{font-family:var(--font-head);font-weight:700;font-size:1.04rem;line-height:1.35;margin:0}
.sb-title-input{font-family:var(--font-head);font-weight:600;text-align:center;width:100%;border:1.5px solid var(--primary);border-radius:10px;padding:.3em .5em;font-size:16px}
.sb-sub{font-size:.8rem;color:var(--muted);margin-top:2px}
.pencil{border:0;background:transparent;cursor:pointer;width:28px;height:28px;border-radius:8px;font-size:.85rem;opacity:.65}
.pencil:hover{opacity:1;background:var(--primary-soft)}
.sb-user{display:flex;align-items:center;gap:10px;margin:14px 14px 4px;padding:10px;border-radius:16px;background:var(--surface-2);border:1px solid var(--line);cursor:pointer;text-align:left;width:calc(100% - 28px)}
.avatar{width:40px;height:40px;border-radius:50%;background:var(--g-lav);display:grid;place-items:center;font-weight:700;color:#5b47a8;overflow:hidden;flex:none;font-family:var(--font-head)}
.avatar img{width:100%;height:100%;object-fit:cover}
.avatar.lg{width:96px;height:96px;font-size:2rem}
.sb-user .who{min-width:0}
.sb-user .who b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:.95rem}
.sb-user .who span{font-size:.8rem;color:var(--muted)}
.sb-nav{flex:1;overflow-y:auto;padding:10px 12px}
.sb-group{font-size:.78rem;color:var(--muted);margin:14px 10px 6px;font-weight:600}
.nav-item{display:flex;align-items:center;gap:12px;width:100%;padding:9px 10px;margin:2px 0;border:0;border-radius:14px;background:transparent;cursor:pointer;text-align:left;font-size:.96rem;color:var(--ink-2);transition:background .18s,transform .18s var(--ease)}
.nav-item .em{width:36px;height:36px;border-radius:12px;display:grid;place-items:center;font-size:1.15rem;flex:none;background:var(--surface-2);border:1px solid var(--line);transition:transform .2s var(--ease)}
.nav-item:hover{background:var(--primary-soft)}
.nav-item:hover .em{transform:scale(1.06) rotate(-4deg)}
.nav-item.active{background:var(--g-rose);color:var(--ink);font-weight:600;box-shadow:var(--shadow-sm)}
.nav-item.active .em{background:#fff;border-color:transparent}
.sb-foot{padding:12px 16px 16px;border-top:1px solid var(--line);font-size:.8rem;color:var(--muted);display:flex;justify-content:space-between;align-items:center;gap:8px}
#sb-overlay{position:fixed;inset:0;background:rgba(46,37,65,.32);z-index:39;opacity:0;pointer-events:none;transition:opacity .25s}
#main{margin-left:var(--sb-w);min-height:100vh;display:flex;flex-direction:column}
#topbar{position:sticky;top:0;z-index:30;height:var(--top-h);display:flex;align-items:center;gap:12px;padding:0 24px;background:rgba(255,247,245,.82);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
#hamburger{display:none}
.tb-title{min-width:0;flex:1}
.tb-title .crumb{font-size:.8rem;color:var(--muted);display:block}
.tb-title b{font-family:var(--font-head);font-size:1.08rem;font-weight:600;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.date-pill{padding:.35em .9em;border-radius:var(--r-pill);background:var(--surface);border:1px solid var(--line);font-size:.86rem;color:var(--ink-2);white-space:nowrap}
#offline-banner{margin:12px 24px 0;padding:10px 14px;border-radius:12px;background:var(--warn-soft);color:#7a4a10;font-size:.92rem}
#view{flex:1;padding:24px;width:100%;max-width:1240px;margin:0 auto;outline:none}
#view.enter>*{animation:rise .35s var(--ease) both}
.app-foot{padding:14px 24px 90px;text-align:center;font-size:.8rem;color:var(--muted)}
#bottom-nav{display:none}
.admin-strip{background:var(--g-lav);text-align:center;font-size:.85rem;padding:6px;font-weight:600;color:#4b3b8f}

/* ---------- page parts */
.page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:14px;flex-wrap:wrap;margin-bottom:18px}
.page-head p{color:var(--muted);margin:0}
.page-actions{display:flex;gap:8px;flex-wrap:wrap}
.grid{display:grid;gap:16px}
.g-2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g-3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g-4{grid-template-columns:repeat(4,minmax(0,1fr))}
.span-2{grid-column:span 2}
.card{background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow);padding:20px;border:1px solid rgba(241,227,234,.6);position:relative;min-width:0}
.card.tight{padding:14px}
.card.flat{box-shadow:none;border-color:var(--line)}
.card h3{display:flex;align-items:center;gap:8px}
.card.tint-rose{background:var(--g-rose);border:0}
.card.tint-lav{background:var(--g-lav);border:0}
.card.tint-mint{background:var(--g-mint);border:0}
.card.tint-peach{background:var(--g-peach);border:0}
.card.tint-sky{background:var(--g-sky);border:0}
.card.tint-lemon{background:var(--g-lemon);border:0}
.card.clickable{cursor:pointer;transition:transform .2s var(--ease),box-shadow .2s}
.card.clickable:hover{transform:translateY(-3px);box-shadow:var(--shadow-lg)}
.card-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px}
.card-head h3{margin:0}
.stat .k{font-size:.88rem;color:var(--ink-2);display:flex;align-items:center;gap:6px}
.stat .v{font-family:var(--font-head);font-size:1.6rem;font-weight:700;line-height:1.25;margin:.15em 0}
.stat .d{font-size:.86rem;color:var(--ink-2)}
.badge{display:inline-flex;align-items:center;gap:4px;padding:.12em .6em;border-radius:var(--r-pill);font-size:.78rem;font-weight:600;background:var(--surface-2);border:1px solid var(--line);color:var(--ink-2);white-space:nowrap}
.badge.est{background:#fff;border-style:dashed;border-color:var(--lav);color:#5b47a8}
.badge.rose{background:var(--primary-soft);border-color:transparent;color:var(--primary-ink)}
.badge.lav{background:var(--lav-soft);border-color:transparent;color:#5b47a8}
.badge.mint{background:var(--mint-soft);border-color:transparent;color:#1f6b51}
.badge.peach{background:var(--peach-soft);border-color:transparent;color:#8a4a1f}
.badge.sky{background:var(--sky-soft);border-color:transparent;color:#2b5b8f}
.badge.warn{background:var(--warn-soft);border-color:transparent;color:#7a4a10}
.badge.danger{background:var(--danger-soft);border-color:transparent;color:#8f2238}
.tabs{display:flex;gap:6px;flex-wrap:wrap;padding:5px;background:rgba(255,255,255,.7);border:1px solid var(--line);border-radius:16px;margin-bottom:16px;overflow-x:auto}
.tab{border:0;background:transparent;padding:.5em 1em;border-radius:12px;cursor:pointer;font-family:var(--font-head);font-size:.92rem;white-space:nowrap;color:var(--ink-2);transition:background .18s}
.tab:hover{background:var(--primary-soft)}
.tab.active{background:#fff;box-shadow:var(--shadow-sm);color:var(--ink);font-weight:600}
.list{display:flex;flex-direction:column;gap:10px}
.row{display:flex;gap:12px;align-items:center;padding:12px 14px;border-radius:14px;background:var(--surface);border:1px solid var(--line);transition:border-color .2s,box-shadow .2s}
.row:hover{border-color:var(--line-2);box-shadow:var(--shadow-sm)}
.row .ic{width:42px;height:42px;border-radius:13px;display:grid;place-items:center;font-size:1.2rem;flex:none}
.row .body{flex:1;min-width:0}
.row .body b{display:block}
.row .body .meta{font-size:.86rem;color:var(--muted);display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.row .acts{display:flex;gap:6px;flex:none}
.ic.rose{background:var(--g-rose)}.ic.lav{background:var(--g-lav)}.ic.mint{background:var(--g-mint)}.ic.peach{background:var(--g-peach)}.ic.sky{background:var(--g-sky)}.ic.lemon{background:var(--g-lemon)}
.empty{text-align:center;padding:30px 16px;color:var(--muted)}
.empty .big{font-size:2.4rem;display:block;margin-bottom:6px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:.94rem}
.kv dt{color:var(--muted)}.kv dd{margin:0;font-weight:500}
.alert{display:flex;gap:12px;padding:14px;border-radius:16px;margin-bottom:10px;border:1px solid transparent}
.alert .ai{font-size:1.4rem;line-height:1}
.alert b{display:block;font-family:var(--font-head)}
.alert p{margin:.2em 0 0;font-size:.92rem}
.alert .ref{font-size:.8rem;opacity:.8;margin-top:4px}
.alert.follow{background:var(--lemon-soft);border-color:#F3E2A2}
.alert.consult{background:var(--peach-soft);border-color:#F7D2B4}
.alert.urgent{background:var(--danger-soft);border-color:#F3B9C6}
.table-wrap{overflow-x:auto;border-radius:14px;border:1px solid var(--line)}
table.tbl{width:100%;border-collapse:collapse;font-size:.92rem;background:var(--surface)}
.tbl th,.tbl td{padding:10px 12px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl th{background:var(--surface-2);font-weight:600;color:var(--ink-2);font-size:.86rem}
.tbl tr:last-child td{border-bottom:0}
.note-box{font-size:.86rem;color:var(--ink-2);background:var(--surface-2);border:1px dashed var(--line-2);border-radius:12px;padding:10px 12px}
.disclaimer{font-size:.84rem;color:var(--muted);text-align:center;margin-top:18px}
.legend{display:flex;flex-wrap:wrap;gap:8px 14px;font-size:.84rem;color:var(--ink-2)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.sw{width:16px;height:16px;border-radius:5px;display:inline-block;flex:none}
.sw.period{background:#F06C9B}.sw.span{background:#FFD3E2}.sw.pred{background:#fff;border:2px dashed #F06C9B}.sw.ov{background:#E5DBFF;border:2px dashed #9C86E0}.sw.fert{background:#D7F3E7}.sw.spot{background:#fff;border:2px solid #F06C9B;border-radius:50%}.sw.today{background:#fff;border:2px solid var(--ink)}
.toggle-chip{border:1.5px solid var(--line-2);background:#fff;border-radius:var(--r-pill);padding:.25em .8em;font-size:.84rem;cursor:pointer}
.toggle-chip.on{background:var(--primary-soft);border-color:var(--primary);color:var(--primary-ink);font-weight:600}

/* ---------- dashboard hero */
.hero{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:16px;margin-bottom:16px}
.stage-wrap{display:flex;flex-direction:column;border-radius:var(--r-lg);overflow:hidden;background:radial-gradient(420px 260px at 50% 36%,#FFFFFF 0%,rgba(255,255,255,0) 70%),linear-gradient(160deg,#FFE9F1 0%,#F0E8FF 55%,#E3F6EE 100%);box-shadow:var(--shadow);padding-bottom:12px}
.stage{position:relative;flex:1;min-height:330px}
.stage canvas{position:absolute;inset:0;width:100%!important;height:100%!important;cursor:pointer}
.stage .ring2d{position:absolute;inset:0;display:grid;place-items:center}
.stage .ring2d svg{width:min(330px,88%);height:auto}
.stage-top{position:absolute;left:18px;top:16px;right:18px;display:flex;justify-content:space-between;gap:10px;z-index:2;pointer-events:none}
.stage-day{background:rgba(255,255,255,.88);border-radius:16px;padding:8px 14px;box-shadow:var(--shadow-sm);pointer-events:auto}
.stage-day .n{font-family:var(--font-head);font-size:1.6rem;font-weight:700;line-height:1.1}
.stage-day .l{font-size:.82rem;color:var(--ink-2)}
.bubble{position:relative;align-self:center;z-index:2;background:#fff;border-radius:16px;padding:8px 16px;box-shadow:var(--shadow-sm);font-size:.92rem;max-width:min(380px,calc(100% - 32px));margin:6px 16px 12px;text-align:center;animation:pop .4s var(--ease)}
.bubble::after{content:"";position:absolute;left:50%;top:-7px;margin-left:-7px;border:7px solid transparent;border-top:0;border-bottom-color:#fff}
.stage-legend{margin:0 12px;display:flex;justify-content:center;flex-wrap:wrap;gap:6px 12px;font-size:.78rem;background:rgba(255,255,255,.72);border-radius:12px;padding:6px 10px}
.hero-cards .stat .v{font-size:1.3rem}
.hero-cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.quick{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-bottom:16px}
.quick .qa{display:flex;align-items:center;gap:12px;padding:14px;border-radius:18px;border:0;cursor:pointer;text-align:left;font-family:var(--font-head);font-weight:600;font-size:.98rem;color:var(--ink);box-shadow:var(--shadow-sm);transition:transform .2s var(--ease),box-shadow .2s}
.quick .qa:hover{transform:translateY(-3px);box-shadow:var(--shadow)}
.quick .qa:active{transform:scale(.97)}
.quick .qa .e{width:44px;height:44px;border-radius:14px;background:rgba(255,255,255,.75);display:grid;place-items:center;font-size:1.35rem;flex:none}
.quick .qa small{display:block;font-family:var(--font-body);font-weight:400;color:var(--ink-2)}
.mascot2d .eye{transform-origin:center;animation:blink 4.5s infinite}
.mascot2d{animation:floaty 3s ease-in-out infinite}

/* ---------- calendar */
.cal-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.cal-head h2{margin:0;min-width:10em;text-align:center}
.cal-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.cal-dow{text-align:center;font-size:.82rem;color:var(--muted);font-weight:600;padding:4px 0}
.cal-day{position:relative;aspect-ratio:1/1.05;min-height:58px;border-radius:14px;border:1.5px solid var(--line);background:var(--surface);cursor:pointer;padding:6px;display:flex;flex-direction:column;align-items:flex-start;justify-content:space-between;text-align:left;transition:transform .15s var(--ease),box-shadow .15s}
.cal-day:hover{transform:translateY(-2px);box-shadow:var(--shadow-sm)}
.cal-day.out{opacity:.38}
.cal-day .dn{font-weight:600;font-size:.95rem;line-height:1}
.cal-day .mk{display:flex;gap:2px;flex-wrap:wrap;font-size:.72rem;line-height:1}
.cal-day.span{background:#FFE6EF;border-color:#FFD3E2}
.cal-day.period{background:#F06C9B;border-color:#F06C9B;color:#fff}
.cal-day.pred{border:2px dashed #F06C9B}
.cal-day.ov{background:repeating-linear-gradient(135deg,#F0EAFF 0 6px,#E5DBFF 6px 12px);border-color:#C9B6F2}
.cal-day.fert{background:#E4F7EE;border-color:#BFEAD7}
.cal-day.spot::after{content:"";position:absolute;top:7px;right:7px;width:9px;height:9px;border-radius:50%;border:2px solid #F06C9B;background:#fff}
.cal-day.today{box-shadow:0 0 0 3px var(--ink) inset}
.cal-day .tag{font-size:.66rem;font-weight:600;padding:1px 5px;border-radius:6px;background:rgba(255,255,255,.85);color:var(--ink-2)}
.cycle-strip{display:flex;gap:3px;overflow-x:auto;padding-bottom:6px}
.cycle-strip .cd{flex:none;width:30px;text-align:center;font-size:.72rem}
.cycle-strip .cd i{display:block;height:30px;border-radius:8px;border:1.5px solid var(--line);margin-bottom:3px;background:#fff}
.cycle-strip .cd.period i{background:#F06C9B;border-color:#F06C9B}.cycle-strip .cd.span i{background:#FFD3E2}
.cycle-strip .cd.pred i{border:2px dashed #F06C9B}.cycle-strip .cd.ov i{background:#E5DBFF;border:2px dashed #9C86E0}.cycle-strip .cd.fert i{background:#D7F3E7}
.cycle-strip .cd.today i{box-shadow:0 0 0 2px var(--ink)}

/* ---------- charts */
.chart{width:100%;height:auto;display:block}
.chart text{font-family:var(--font-body);font-size:12px;fill:var(--ink-2)}
.chart .grid-l{stroke:var(--line);stroke-width:1}
.bar-label{font-weight:600}

/* ---------- modal / drawer / toast / popup */
#modal-root .backdrop{position:fixed;inset:0;background:rgba(46,37,65,.38);z-index:80;display:flex;align-items:flex-end;justify-content:center;padding:0;animation:fadeIn .2s}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.modal{width:100%;max-width:640px;max-height:92vh;display:flex;flex-direction:column;background:var(--surface);border-radius:24px 24px 0 0;box-shadow:var(--shadow-lg);animation:sheetUp .3s var(--ease)}
.modal.wide{max-width:880px}
@keyframes sheetUp{from{transform:translateY(40px);opacity:.4}to{transform:none;opacity:1}}
.modal-head{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:18px 22px 10px;border-bottom:1px solid var(--line)}
.modal-head h2{margin:0;font-size:1.15rem}
.modal-body{padding:18px 22px;overflow-y:auto}
.modal-foot{padding:12px 22px 18px;border-top:1px solid var(--line);display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap}
@media (min-width:720px){#modal-root .backdrop{align-items:center;padding:20px}.modal{border-radius:24px}}
#toast-root{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:120;display:flex;flex-direction:column;gap:8px;align-items:center;width:min(94vw,480px);pointer-events:none}
.toast{pointer-events:auto;display:flex;align-items:center;gap:12px;padding:12px 16px;border-radius:16px;background:var(--ink);color:#fff;box-shadow:var(--shadow-lg);font-size:.94rem;animation:rise .3s var(--ease);width:100%}
.toast.ok{background:#2B6E58}.toast.err{background:#A3304B}.toast.warn{background:#8A5A12}
.toast .t-act{margin-left:auto;background:rgba(255,255,255,.18);border:0;color:#fff;border-radius:10px;padding:.35em .8em;cursor:pointer;font-weight:600;white-space:nowrap}
.savepw{position:fixed;top:16px;right:16px;z-index:130;width:min(380px,calc(100vw - 32px));background:#fff;border-radius:20px;box-shadow:var(--shadow-lg);border:1px solid var(--line);padding:18px;animation:slideIn .35s var(--ease)}
.savepw h3{font-size:1.02rem;margin:0 0 4px;display:flex;gap:8px;align-items:center}
.savepw .x{position:absolute;top:10px;right:10px;width:32px;height:32px;border-radius:10px;border:0;background:transparent;cursor:pointer;font-size:1rem}
.savepw .x:hover{background:var(--surface-2)}
.savepw .cred{display:grid;gap:8px;margin:10px 0}
.savepw .cred .input{min-height:40px;font-size:.95rem;background:var(--surface-2)}
.savepw .acts{display:flex;gap:8px;justify-content:flex-end}
.savepw .never{margin-top:8px;text-align:right}
.skel{background:linear-gradient(90deg,#F6EDF1 25%,#FBF5F8 50%,#F6EDF1 75%);background-size:200% 100%;animation:shimmer 1.2s infinite;border-radius:12px}
@keyframes shimmer{to{background-position:-200% 0}}
.steps{display:flex;gap:6px;margin-bottom:16px}
.steps i{flex:1;height:6px;border-radius:6px;background:var(--line)}
.steps i.on{background:var(--g-primary)}
.article-body ul{padding-left:1.2em;margin:.4em 0 .8em}
.article-body li{margin:.25em 0}
.refs{font-size:.84rem;color:var(--ink-2);background:var(--surface-2);border-radius:12px;padding:10px 14px;word-break:break-word}
.refs p{margin:.35em 0;padding-left:1.6em;text-indent:-1.6em}
.copy-row{display:flex;gap:8px}
.copy-row .input{font-size:.86rem}
.pwa-icons{display:flex;gap:16px;flex-wrap:wrap;align-items:flex-end;margin:14px 0 6px}
.pwa-icons figure{margin:0;text-align:center;font-size:.78rem;color:var(--muted);width:92px}
.pwa-icons img{display:block;width:72px;height:72px;margin:0 auto 6px;filter:drop-shadow(0 4px 10px rgba(80,40,90,.18))}
.pwa-icons img.mask{border-radius:50%}
.pwa-icons img.ios{border-radius:22%}
.pwa-icons img.sm{width:32px;height:32px;border-radius:6px;margin-top:40px}
.pwa-status{display:flex;flex-wrap:wrap;gap:8px 22px}
.pwa-steps li{margin-bottom:6px}
.pwa-steps code,.card code{background:var(--surface-2);border:1px solid var(--line);border-radius:6px;padding:0 5px;font-size:.85em;overflow-wrap:anywhere}

/* ---------- report (screen + print) */
.report{background:#fff;border-radius:var(--r);box-shadow:var(--shadow);padding:28px;font-size:.95rem}
.report h2{border-bottom:2px solid var(--line);padding-bottom:6px;margin-top:18px}
.report .rep-head{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;border-bottom:3px solid var(--primary);padding-bottom:12px;margin-bottom:8px}
.report .rep-head h1{font-size:1.35rem;margin:0}
.report .tbl th,.report .tbl td{white-space:normal}

/* ---------- responsive */
@media (max-width:1180px){.g-4{grid-template-columns:repeat(2,minmax(0,1fr))}.hero{grid-template-columns:1fr}}
@media (max-width:991px){
  #sidebar{transform:translateX(-100%);box-shadow:none}
  body.sb-open #sidebar{transform:none;box-shadow:var(--shadow-lg)}
  body.sb-open #sb-overlay{opacity:1;pointer-events:auto}
  #main{margin-left:0}
  #hamburger{display:inline-flex}
  .g-3{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media (max-width:767px){
  #view{padding:16px 14px}
  #topbar{padding:0 12px;height:60px}
  .date-pill{display:none}
  .g-2,.g-3,.g-4,.form-grid{grid-template-columns:1fr}
  .span-2{grid-column:auto}
  .hero-cards{grid-template-columns:1fr 1fr;gap:10px}
  .quick{grid-template-columns:1fr;gap:8px}
  .stage{min-height:280px}
  .card{padding:16px}
  .stat .v{font-size:1.3rem}
  .hero-cards .stat .v{font-size:1.08rem}
  .hero-cards .stat .k{font-size:.8rem}
  .cal-grid{gap:4px}
  .cal-day{min-height:44px;border-radius:11px;padding:4px}
  .cal-day .dn{font-size:.85rem}
  .cal-day .tag{display:none}
  #bottom-nav{display:grid;grid-template-columns:repeat(5,1fr);position:fixed;left:10px;right:10px;bottom:10px;z-index:35;background:rgba(255,255,255,.95);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-radius:22px;box-shadow:var(--shadow-lg);border:1px solid var(--line);padding:6px;padding-bottom:calc(6px + env(safe-area-inset-bottom))}

  #bottom-nav button .e{font-size:1.25rem;line-height:1.2}
  #bottom-nav button.active{background:var(--primary-soft);color:var(--primary-ink);font-weight:600}
  #bottom-nav button.add .e{width:44px;height:44px;margin-top:-22px;border-radius:16px;background:var(--g-primary);color:#fff;display:grid;place-items:center;box-shadow:0 8px 18px color-mix(in srgb,var(--primary) 40%,transparent)}
  .page-head h1{font-size:1.3rem}
  .row{flex-wrap:wrap}
  .row .acts{width:100%;justify-content:flex-end}

}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.001ms!important;animation-iteration-count:1!important;transition-duration:.001ms!important;scroll-behavior:auto!important}}
@media print{
  body{background:#fff}
  #sidebar,#topbar,#bottom-nav,#sb-overlay,.app-foot,.no-print,#toast-root,#bg-layer,#bg-dim,.admin-strip{display:none!important}
  #main{margin:0}#view{padding:0;max-width:none}
  .report{box-shadow:none;padding:0}
  .card{box-shadow:none}
}

function md(text) {
  const esc = h(text || '').replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
  return esc.split(/\n\s*\n/).map(block => {
    const lines = block.split('\n');
    if (lines.every(l => /^\s*-\s+/.test(l))) return '<ul>' + lines.map(l => '<li>' + l.replace(/^\s*-\s+/, '') + '</li>').join('') + '</ul>';
    if (lines.some(l => /^\s*-\s+/.test(l))) {
      return lines.map(l => /^\s*-\s+/.test(l) ? '<ul><li>' + l.replace(/^\s*-\s+/, '') + '</li></ul>' : '<p>' + l + '</p>').join('').replace(/<\/ul><ul>/g, '');
    }
    return '<p>' + lines.join('<br>') + '</p>';
  }).join('');
}

function shade(hex, amt) {
  const m = /^#?([0-9a-f]{6})$/i.exec(hex || ''); if (!m) return hex;
  const n = parseInt(m[1], 16);

}

function saveSession(sess) {
  S.token = sess.token; S.remember = !!sess.remember;
  store.del('tk');
  store.set('tk', sess.token, !sess.remember);
}
function clearSession() { S.token = ''; store.del('tk'); store.del('atk'); }
async function tryResume() {
  const tk = store.get('tk');
  if (!tk) return false;
  S.token = tk;
  try {
    const d = await api('resume', {}, { silentAuth: true });
    S.remember = !!(d.session && d.session.remember);
    startApp(d.boot);
    return true;
  } catch (e) {
    if (e.code === 'AUTH') clearSession();
    else { S.token = ''; renderLogin({ type: 'warn', text: errMsg(e) }); return true; }
    return false;
  }
}

function maybeSavePrompt(ctx) {
  if (!ctx || !ctx.identifier || !ctx.password) return;
  if (store.get('savePrompt') === 'never' || store.get('saved_' + ctx.identifier) === '1') return;
  let pw = ctx.password;
  const root = $('#popup-root');
  root.innerHTML = '<div class="savepw" role="dialog" aria-label="บันทึกรหัสผ่าน"><button class="x" type="button" data-pop="close" aria-label="ปิด">✕</button>' +
    '<h3>🔐 บันทึกรหัสผ่านสำหรับเว็บนี้ไหม?</h3><p class="small muted" style="margin:0">ครั้งหน้าเปิดระบบแล้วเข้าใช้งานได้ทันที ไม่ต้องพิมพ์ชื่อผู้ใช้และรหัสผ่านใหม่</p>' +
    '<div class="cred"><input class="input" value="' + h(ctx.identifier) + '" readonly aria-label="ชื่อผู้ใช้"><div class="input-wrap"><input class="input" type="password" value="' + h(pw) + '" readonly aria-label="รหัสผ่าน"><button type="button" class="eye" data-pop="eye" aria-label="แสดงหรือซ่อนรหัสผ่าน">👁️</button></div></div>' +
    '<p class="small muted" style="margin:0 0 10px">ไม่แนะนำบนเครื่องสาธารณะหรือเครื่องที่ใช้ร่วมกัน</p>' +
    '<div class="acts"><button class="btn btn-ghost btn-sm" type="button" data-pop="later">ไม่ใช่ตอนนี้</button><button class="btn btn-primary btn-sm" type="button" data-pop="save">บันทึก</button></div>' +
    '<div class="never"><button class="link-btn small" type="button" data-pop="never">ไม่ต้องถามอีกสำหรับเว็บนี้</button></div></div>';
  const box = root.firstChild;
  const close = () => { pw = ''; $$('input', box).forEach(i => { i.value = ''; }); box.remove(); clearTimeout(timer); };
  const timer = setTimeout(close, 20000);
  box.addEventListener('click', async e => {
    const b = e.target.closest('[data-pop]'); if (!b) return;
    const act = b.dataset.pop;
    if (act === 'eye') { const i = b.parentNode.querySelector('input'); i.type = i.type === 'password' ? 'text' : 'password'; return; }
    if (act === 'never') { store.set('savePrompt', 'never'); close(); toast('จะไม่ถามอีกในอุปกรณ์นี้'); return; }
    if (act === 'later' || act === 'close') { close(); return; }
    if (act === 'save') {
      try {
        const r = await withBusy(b, () => api('rememberMe', { on: true }));
        S.remember = true;
        store.set('tk', S.token); store.set('lastUser', ctx.identifier); store.set('saved_' + ctx.identifier, '1'); store.set('rememberPref', '1');
        let viaBrowser = false;
        try {
          if (window.PasswordCredential && window.top === window.self && navigator.credentials) {
            await navigator.credentials.store(new window.PasswordCredential({ id: ctx.identifier, password: pw, name: (S.profile && S.profile.displayName) || ctx.identifier }));
            viaBrowser = true;
          }
        } catch (e2) { /* เบราว์เซอร์ไม่รองรับในกรอบหน้าเว็บนี้ */ }
        close();
        toast(viaBrowser ? 'บันทึกในเบราว์เซอร์แล้ว ✅' : 'จดจำการเข้าสู่ระบบไว้ ' + (S.pub.rememberDays || 30) + ' วันแล้ว ✅ ถ้าเบราว์เซอร์ถามบันทึกรหัสผ่าน ให้กด "บันทึก" ได้เลย', { type: 'ok', timeout: 6000 });
        if (r && r.expiresAt) S.sessionExpires = r.expiresAt;
      } catch (err) { toast(errMsg(err), { type: 'err' }); }
    }
  });
}

  if (L.sexual && (S.data.DailyLogs || []).some(l => l.date === d && l.sex_activity && l.sex_activity !== 'none')) mk.push('💞');

function cycleStrip() {

  m.el.addEventListener('click', e => {

    '<button class="btn btn-danger btn-xs" type="button" data-rec="del" data-table="' + table + '" data-id="' + h(id) + '" aria-label="ลบ ' + h(title) + '">🗑️ ลบ</button></div></div>';

function signalText(s) {
  if (s.kind === 'LH' || s.kind === 'PREG') return (RESULT[s.result] || '') + (s.time ? ' เวลา ' + s.time + ' น.' : '');
  if (s.kind === 'BBT') return tempText(s.value) + (s.time ? ' เวลา ' + s.time + ' น.' : '') + ((s.disturbances || []).length ? ' (ปัจจัยรบกวน: ' + s.disturbances.map(d => DISTURB[d] || d).join(', ') + ')' : '');
  return (s.method ? s.method + ': ' : '') + (s.result || '');

function tempText(c) {
  if (c === null || c === undefined) return '-';
  return S.settings.tempUnit === 'F' ? (c * 9 / 5 + 32).toFixed(2) + ' °F' : Number(c).toFixed(2) + ' °C';
}
function findRec(table, id) { return (S.data[table] || []).filter(r => r.id === id)[0]; }
const TABLE_LABEL = { Periods: 'รอบประจำเดือน', BleedDays: 'บันทึกเลือดออก', DailyLogs: 'บันทึกรายวัน', Signals: 'ผลตรวจ', Meds: 'ยา/ฮอร์โมน', Modes: 'โหมดสุขภาพ', Reminders: 'การแจ้งเตือน' };
const FORMS = {};
function handleRecAct(el) {
  const t = el.dataset.table, id = el.dataset.id, rec = findRec(t, id);
  if (el.dataset.rec === 'del') { removeRecord(t, id, TABLE_LABEL[t] || 'รายการ'); return; }
  if (!rec) { toast('ไม่พบรายการ อาจถูกลบไปแล้ว', { type: 'warn' }); return; }

}
async function removeRecord(table, id, label) {

  if (!ok) return;
  try {
    const res = await api('remove', { table: table, id: id });
    applyMutation(res); rerender();
    toast('ลบ' + label + 'แล้ว', { action: '↩️ เลิกทำ', onAction: async () => {
      try { const r2 = await api('restore', { table: table, id: id }); applyMutation(r2); rerender(); toast('กู้คืนแล้ว', { type: 'ok' }); }
      catch (e) { toast(errMsg(e), { type: 'err' }); }

function openForm(o) {
  const attach = o.attach ? attachBlock(o.attach, o.values.id) : '';
  const m = modal({ title: o.title, wide: o.wide,
    body: (o.intro || '') + '<form data-rec-form novalidate>' + formHtml(o.fields, o.values) + attach + (o.after || '') + '<div class="notice err" data-form-err hidden></div></form>',
    foot: (o.values.id && !o.noDelete ? '<button class="btn btn-danger" type="button" data-f="del" style="margin-right:auto">🗑️ ลบ</button>' : '') + '<button class="btn btn-ghost" type="button" data-f="cancel">ยกเลิก</button><button class="btn btn-primary" type="button" data-f="save">💾 บันทึก</button>' });
  const form = $('[data-rec-form]', m.el);
  wireForm(form);
  if (o.wire) o.wire(form, m);
  const pending = [];
  if (o.attach) wireAttach(form, pending);
  const save = async btn => {
    let rec = readForm(form, o.fields);
    if (o.values.id) rec.id = o.values.id;
    if (o.prepare) { try { rec = o.prepare(rec, form); } catch (e) { showErr(form, e); return; } if (!rec) return; }
    await withBusy(btn, async () => {
      try {
        const res = o.submit ? await o.submit(rec) : await saveRecordSmart(o.table, rec);
        if (!res) return;
        if (o.attach && pending.length) {
          const ownerId = (res.record && res.record.id) || rec.id;
          for (let i = 0; i < pending.length; i++) {
            try { const up = await api('upload', { purpose: 'attachment', ownerType: o.table, ownerId: ownerId, dataUrl: pending[i], name: 'รูปแนบ' }); S.images[up.fileId] = up.dataUrl; S.data.Attachments = (S.data.Attachments || []).concat([up.attachment]); }
            catch (e) { toast('แนบรูปที่ ' + (i + 1) + ' ไม่สำเร็จ: ' + errMsg(e), { type: 'warn' }); }
          }
        }
        m.close(); rerender(); Mascot3D.cheer();
        toast((o.okText || 'บันทึกแล้ว') + ' ✅', { type: 'ok' });
      } catch (e) { showErr(form, e); }
    });
  };
  m.el.querySelector('.modal-foot').addEventListener('click', e => {
    const b = e.target.closest('[data-f]'); if (!b) return;
    if (b.dataset.f === 'cancel') m.close();
    if (b.dataset.f === 'save') save(b);
    if (b.dataset.f === 'del') { m.close(); removeRecord(o.table, o.values.id, TABLE_LABEL[o.table]); }
  });
  form.addEventListener('submit', e => { e.preventDefault(); save(m.el.querySelector('[data-f=save]')); });
  return m;
}
async function saveRecordSmart(table, rec) {
  try {
    const res = await api('save', { table: table, record: rec });
    applyMutation(res); return res;
  } catch (e) {
    if (e.code === 'CONFIRM') {
      const yes = await confirmBox('ยืนยันการบันทึก', h(e.message), { ok: 'บันทึกเป็นรอบใหม่' });

    }

}
function attachBlock(ownerType, ownerId) {
  const existing = ownerId ? (S.data.Attachments || []).filter(a => a.owner_id === ownerId) : [];
  return '<div class="field full"><span class="field-label">📎 แนบรูป (ไม่บังคับ สูงสุด 5 รูป)</span><div class="hint">เช่น รูปผลตรวจ ระบบย่อขนาดและลบข้อมูลตำแหน่ง (GPS) ออกจากรูปก่อนอัปโหลด</div>' +
    '<div class="thumbs" data-thumbs>' + existing.map(a => '<div class="thumb"><img data-file="' + h(a.file_id) + '" alt="รูปแนบ"><button type="button" data-att-del="' + h(a.id) + '" aria-label="ลบรูป">✕</button></div>').join('') + '</div>' +
    '<button class="btn btn-soft btn-sm" type="button" data-att-add style="margin-top:8px">➕ เลือกรูป</button></div>';

function wireAttach(form, pending) {
  hydrateImages(form);
  form.addEventListener('click', async e => {
    if (e.target.closest('[data-att-add]')) {
      const box = $('[data-thumbs]', form);
      const files = await pickFiles(true);
      for (const f of files) {
        if (box.children.length >= 5) { toast('แนบได้สูงสุด 5 รูป', { type: 'warn' }); break; }
        try {
          const data = await compressImage(f, { maxSide: 2048 });
          pending.push(data);
          const d = document.createElement('div'); d.className = 'thumb'; d.innerHTML = '<img src="' + data + '" alt="รูปที่เลือก"><button type="button" data-pend-del aria-label="เอาออก">✕</button>';
          d.dataset.idx = String(pending.length - 1); box.appendChild(d);
        } catch (err) { toast(errMsg(err), { type: 'err' }); }
      }
    }
    const pd = e.target.closest('[data-pend-del]');
    if (pd) { const t = pd.parentNode; pending[+t.dataset.idx] = null; t.remove(); for (let i = pending.length - 1; i >= 0; i--) if (!pending[i]) pending.splice(i, 1); }
    const ad = e.target.closest('[data-att-del]');
    if (ad && await confirmBox('ลบรูปแนบ', 'ต้องการลบรูปนี้ใช่หรือไม่?', { ok: 'ลบรูป', danger: true })) {
      try { const r = await api('removeAttachment', { id: ad.dataset.attDel }); S.data.Attachments = r.attachments; ad.parentNode.remove(); toast('ลบรูปแล้ว'); }
      catch (err) { toast(errMsg(err), { type: 'err' }); }
    }
    const img = e.target.closest('.thumb img'); if (img && img.src) viewImage(img.src);
  });
}

/* =============================================================== charts */
function barChart(items, o) {
  o = o || {};
  if (!items.length) return '<div class="empty">ยังไม่มีข้อมูลพอสำหรับกราฟ</div>';
  const W = 640, H = 240, pl = 36, pr = 12, pt = 18, pb = 44;
  const max = Math.max.apply(null, items.map(i => i.v).concat([o.ref || 0])) * 1.15 || 1;
  const bw = (W - pl - pr) / items.length;
  let g = '';
  for (let k = 0; k <= 4; k++) { const v = Math.round(max / 4 * k), y = pt + (H - pt - pb) * (1 - k / 4); g += '<line class="grid-l" x1="' + pl + '" x2="' + (W - pr) + '" y1="' + y + '" y2="' + y + '"/><text x="' + (pl - 6) + '" y="' + (y + 4) + '" text-anchor="end">' + v + '</text>'; }
  items.forEach((it, i) => {
    const bh = (H - pt - pb) * it.v / max, x = pl + i * bw + bw * 0.18, y = H - pb - bh, w = bw * 0.64;
    g += '<rect x="' + x.toFixed(1) + '" y="' + y.toFixed(1) + '" width="' + w.toFixed(1) + '" height="' + bh.toFixed(1) + '" rx="7" fill="' + (it.c || '#F4A6C2') + '"><title>' + h(it.t || '') + '</title></rect>' +
      '<text class="bar-label" x="' + (x + w / 2).toFixed(1) + '" y="' + (y - 5).toFixed(1) + '" text-anchor="middle">' + it.v + '</text>' +
      '<text x="' + (x + w / 2).toFixed(1) + '" y="' + (H - pb + 16) + '" text-anchor="middle">' + h(it.l) + '</text>';
  });
  if (o.ref) { const y = pt + (H - pt - pb) * (1 - o.ref / max); g += '<line x1="' + pl + '" x2="' + (W - pr) + '" y1="' + y + '" y2="' + y + '" stroke="#9C86E0" stroke-width="2" stroke-dasharray="6 5"/><text x="' + (W - pr) + '" y="' + (y - 6) + '" text-anchor="end" fill="#6B55C8">' + h(o.refLabel || '') + '</text>'; }
  return '<svg class="chart" viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="' + h(o.label || 'กราฟ') + '">' + g + '</svg>';
}
function lineChart(points, o) {
  o = o || {};
  if (points.length < 2) return '<div class="empty">ต้องมีอย่างน้อย 2 ค่าเพื่อแสดงแนวโน้ม</div>';
  const W = 640, H = 220, pl = 46, pr = 14, pt = 16, pb = 36;
  const xs = points.map(p => p.x), ys = points.map(p => p.y);
  const x0 = Math.min.apply(null, xs), x1 = Math.max.apply(null, xs), y0 = Math.min.apply(null, ys) - 0.15, y1 = Math.max.apply(null, ys) + 0.15;
  const X = x => pl + (W - pl - pr) * (x1 === x0 ? 0.5 : (x - x0) / (x1 - x0)), Y = y => pt + (H - pt - pb) * (1 - (y - y0) / (y1 - y0));
  let g = '';
  for (let k = 0; k <= 3; k++) { const v = y0 + (y1 - y0) * k / 3, y = Y(v); g += '<line class="grid-l" x1="' + pl + '" x2="' + (W - pr) + '" y1="' + y + '" y2="' + y + '"/><text x="' + (pl - 6) + '" y="' + (y + 4) + '" text-anchor="end">' + v.toFixed(2) + '</text>'; }
  g += '<polyline fill="none" stroke="#9C86E0" stroke-width="2.5" stroke-linejoin="round" points="' + points.map(p => X(p.x).toFixed(1) + ',' + Y(p.y).toFixed(1)).join(' ') + '"/>';
  points.forEach(p => { g += '<circle cx="' + X(p.x).toFixed(1) + '" cy="' + Y(p.y).toFixed(1) + '" r="4.5" fill="' + (p.flag ? '#fff' : '#9C86E0') + '" stroke="#9C86E0" stroke-width="2"><title>' + h(p.t || '') + '</title></circle><text x="' + X(p.x).toFixed(1) + '" y="' + (H - pb + 16) + '" text-anchor="middle">' + p.x + '</text>'; });
  g += '<text x="' + ((W + pl) / 2) + '" y="' + (H - 4) + '" text-anchor="middle">' + h(o.xLabel || '') + '</text>';
  return '<svg class="chart" viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="' + h(o.label || 'กราฟเส้น') + '">' + g + '</svg>';
}

function cycleOf(d) {
  const ps = ((S.analysis || {}).periods || []).filter(p => p.start <= d);
  const p = ps[ps.length - 1];
  return p ? { start: p.start, day: diffDays(d, p.start) + 1, next: p.next } : null;
}
function symptomPhases() {
  const phases = [['วันที่ 1–5', 1, 5], ['วันที่ 6–13', 6, 13], ['วันที่ 14–20', 14, 20], ['วันที่ 21 ขึ้นไป', 21, 999]];
  const counts = phases.map(() => ({}));
  const add = (d, list) => { const c = cycleOf(d); if (!c) return; const i = phases.findIndex(p => c.day >= p[1] && c.day <= p[2]); if (i < 0) return; (list || []).forEach(s => { counts[i][s] = (counts[i][s] || 0) + 1; }); };
  (S.data.DailyLogs || []).forEach(l => add(l.date, (l.symptoms || []).concat(l.mood || [])));
  (S.data.BleedDays || []).forEach(b => add(b.date, b.symptoms));
  return phases.map((p, i) => ({ label: p[0], top: Object.keys(counts[i]).map(k => [k, counts[i][k]]).sort((x, y) => y[1] - x[1]).slice(0, 5) }));
}

function exportCsv(kind) {
  let rows, cols, name;

    cols = [['start', 'วันเริ่ม'], ['end', 'วันสิ้นสุด'], ['endStatus', 'สถานะ'], ['length', 'ความยาวรอบ (วัน)'], ['spanDays', 'ช่วงประจำเดือน (วัน)'], ['bledDays', 'วันที่บันทึกว่ามีเลือด'], ['certainty', 'ความแน่ใจ'], [r => r.exclude ? 'ไม่ใช้' : 'ใช้', 'ใช้คำนวณ']];
    name = 'periods.csv';
  } else if (kind === 'logs') {
    rows = (S.data.DailyLogs || []).slice().sort((x, y) => x.date < y.date ? -1 : 1);
    cols = [['date', 'วันที่'], ['symptoms', 'อาการ'], ['mood', 'อารมณ์'], ['sleep_hours', 'ชั่วโมงนอน'], [r => SLEEPQ[r.sleep_quality] || '', 'คุณภาพการนอน'], ['stress', 'ความเครียด'], ['activity', 'กิจกรรม'], ['illness', 'การเจ็บป่วย'], [r => MUCUS[r.mucus] || '', 'มูก'], ['note', 'บันทึก']];
    name = 'daily-logs.csv';
  } else if (kind === 'signals') {
    rows = (S.data.Signals || []).slice().sort((x, y) => x.date < y.date ? -1 : 1);
    cols = [['date', 'วันที่'], ['time', 'เวลา'], [r => SIGNALS[r.kind].l, 'ประเภท'], [r => r.kind === 'CLINIC' ? r.result : (RESULT[r.result] || ''), 'ผล'], ['value', 'อุณหภูมิ (°C)'], ['method', 'วิธี'], ['note', 'หมายเหตุ']];
    name = 'signals.csv';
  } else if (kind === 'bleeds') {
    rows = (S.data.BleedDays || []).slice().sort((x, y) => x.date < y.date ? -1 : 1);
    cols = [['date', 'วันที่'], [r => BLEED_TYPE[r.bleed_type], 'ประเภท'], [r => FLOW[r.flow] || '', 'ปริมาณ'], ['pain', 'ความปวด'], [r => IMPACT[r.impact] || '', 'ผลกระทบ'], ['symptoms', 'อาการ'], ['note', 'หมายเหตุ']];
    name = 'bleeding-days.csv';
  }
  download(name, toCsv(rows, cols), 'text/csv');
}

function obCollect(skip) {
  const f = $('#ob-form'); if (!f || skip) return;
  const s = OB.step;
  if (s === 0) OB.goals = $$('[name=goals]:checked', f).map(i => i.value);
  if (s === 1) { OB.start = f.start.value; OB.certainty = fieldValue(f, 'certainty') || 'exact'; OB.endStatus = fieldValue(f, 'endStatus') || 'unknown'; OB.end = f.end ? f.end.value : ''; }
  if (s === 2) OB.prev = $$('[data-prev]', f).map(i => i.value).filter(isDate);
  if (s === 3) { OB.typicalCycle = f.typicalCycle.value; OB.typicalPeriod = f.typicalPeriod.value; OB.regularity = fieldValue(f, 'regularity'); }
  if (s === 4) OB.mode = fieldValue(f, 'mode') || 'general';
}
async function obFinish(skipAll) {
  const periods = [];
  if (!skipAll) {
    if (isDate(OB.start)) periods.push({ start_date: OB.start, start_certainty: OB.certainty, end_status: OB.endStatus, end_date: OB.endStatus === 'ended' ? OB.end : '' });
    OB.prev.filter(d => d !== OB.start).forEach(d => periods.push({ start_date: d, start_certainty: 'approx', end_status: 'unknown' }));
  }
  try {
    const boot = await api('onboarding', { settings: skipAll ? {} : { goals: OB.goals, typicalCycle: OB.typicalCycle || null, typicalPeriod: OB.typicalPeriod || null, regularity: OB.regularity }, periods: periods, mode: skipAll ? '' : OB.mode });
    OB = null;
    S.settings = boot.settings; S.data = boot.data; S.analysis = boot.analysis; S.profile = boot.profile;
    go('today', {}, { replace: true });
    toast('ตั้งค่าเริ่มต้นเรียบร้อย 🌸', { type: 'ok' });
  } catch (e) { toast(errMsg(e), { type: 'err' }); }
}

function svgDataUrl(svg) {
  if (!/xmlns=/.test(svg)) svg = svg.replace('<svg', '<svg xmlns="http://www.w3.org/2000/svg"');
  return 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg);
}
function loadImg(src) { return new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = () => rej(new Error('โหลดโลโก้ไม่สำเร็จ กรุณาอัปโหลดโลโก้ใหม่ที่หน้าแบรนด์')); i.src = src; }); }
async function makePwaIcons() {
  const img = await loadImg(S.pub.logo || svgDataUrl(DEFAULT_LOGO));
  const N = 512;
  const base = document.createElement('canvas'); base.width = base.height = N;
  const bx = base.getContext('2d');
  const w0 = img.naturalWidth || N, h0 = img.naturalHeight || N, r0 = Math.min(N / w0, N / h0);
  bx.imageSmoothingEnabled = true; bx.imageSmoothingQuality = 'high';
  bx.drawImage(img, (N - w0 * r0) / 2, (N - h0 * r0) / 2, w0 * r0, h0 * r0);
  const px = bx.getImageData(0, 0, N, N).data;
  const A = (x, y) => px[(y * N + x) * 4 + 3];
  // โลโก้ที่มีมุมโปร่งใส (เช่นไอคอนกรอบมน): หากรอบจัตุรัสกลางภาพที่ทึบทั้งหมด เพื่อทำไอคอนแบบเต็มกรอบ
  let inset = 0;
  const corners = i => [[i, i], [N - 1 - i, i], [i, N - 1 - i], [N - 1 - i, N - 1 - i]].every(p => A(p[0], p[1]) >= 250);
  while (inset < N * 0.3 && !corners(inset)) inset++;
  const fits = inset < N * 0.3;
  if (inset) inset = Math.min(Math.round(N * 0.3), inset + 3); // เผื่อขอบจาง
  // สีพื้นสำรองจากขอบด้านในของโลโก้
  let rr = 0, gg = 0, bb = 0, cnt = 0;
  for (let i = inset; i < N - inset; i += 4) [[i, inset], [i, N - 1 - inset], [inset, i], [N - 1 - inset, i]].forEach(p => {
    const k = (p[1] * N + p[0]) * 4; if (px[k + 3] > 200) { rr += px[k]; gg += px[k + 1]; bb += px[k + 2]; cnt++; }
  });
  const fill = cnt ? 'rgb(' + Math.round(rr / cnt) + ',' + Math.round(gg / cnt) + ',' + Math.round(bb / cnt) + ')' : '#FFE9F1';
  const draw = (size, bleed) => {
    const c = document.createElement('canvas'); c.width = c.height = size;
    const x = c.getContext('2d');
    x.imageSmoothingEnabled = true; x.imageSmoothingQuality = 'high';
    if (!bleed) { x.drawImage(base, 0, 0, size, size); return c.toDataURL('image/png'); } // ไอคอนทั่วไป: คงรูปทรงและมุมโปร่งใสของโลโก้
    // iPhone และ Android (maskable) ต้องทึบเต็มกรอบ ระบบปฏิบัติการจะตัดมุมเอง
    x.fillStyle = fill; x.fillRect(0, 0, size, size);
    if (fits) { const s = N - inset * 2; x.drawImage(base, inset, inset, s, s, 0, 0, size, size); }
    else { const d = size * 0.8; x.drawImage(base, (size - d) / 2, (size - d) / 2, d, d); }
    return c.toDataURL('image/png');
  };
  return { 'icon-192.png': draw(192, false), 'icon-512.png': draw(512, false), 'icon-maskable-512.png': draw(512, true), 'apple-touch-icon.png': draw(180, true), 'favicon-32.png': draw(32, false) };
}
function downloadBase64(name, b64, mime) {
  try {
    const bin = atob(b64), bytes = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([bytes], { type: mime })); a.download = name; a.rel = 'noopener';
    document.body.appendChild(a); a.click();
    setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1500);
    return true;
  } catch (e) { return false; }
}

function wireAdminPw(f, onDone) {
  wireStrength(f); wireConfirm(f); wireForm(f);

    e.preventDefault();
    try {
      await withBusy(f.querySelector('[type=submit]'), () => api('adminChangePassword', { current: f.current.value, password: f.password.value, confirm: f.confirm.value }));

};
function readMenuEdit() {
  return $$('#menu-edit [data-mid]').map(r => ({ id: r.dataset.mid, emoji: $('[data-m=emoji]', r).value.trim(), label: $('[data-m=label]', r).value.trim(), hidden: !!($('[data-m=hidden]', r) && $('[data-m=hidden]', r).checked) }));
}
function menuMove(i, d) {
  const list = readMenuEdit(), j = i + d;
  if (j < 0 || j >= list.length) return;
  const t = list[i]; list[i] = list[j]; list[j] = t;
  S.settings.menu = list; go('me', { tab: 'menu' }, { keepScroll: true });
}

/* ================================================================= init */
function init() {
  window.addEventListener('error', e => { console.error(e.error || e.message); if (S.started) toast('เกิดข้อผิดพลาดบนหน้าเว็บ ระบบยังทำงานต่อได้ หากพบซ้ำให้กดรีเฟรช', { type: 'err' }); });
  window.addEventListener('unhandledrejection', e => { console.error(e.reason); const msg = e.reason && e.reason.message; if (S.started && msg) toast(msg, { type: 'err' }); e.preventDefault(); });
  const net = () => { const off = navigator.onLine === false; const b = $('#offline-banner'); if (b) b.hidden = !off; if (!off && S.started) toast('กลับมาออนไลน์แล้ว', { type: 'ok' }); };
  window.addEventListener('online', net); window.addEventListener('offline', net);
  document.addEventListener('click', e => {
    const rec = e.target.closest('[data-rec]');
    if (rec && !rec.closest('.modal')) { handleRecAct(rec); return; }
    const el = e.target.closest('[data-act]');
    if (!el || !ACT[el.dataset.act]) return;
    if (el.getAttribute('aria-disabled') === 'true' && el.dataset.act !== 'google') return;
    e.preventDefault();
    try { const r = ACT[el.dataset.act](el, e); if (r && r.catch) r.catch(err => toast(errMsg(err), { type: 'err' })); }
    catch (err) { console.error(err); toast(errMsg(err), { type: 'err' }); }
  });
  $('#hamburger').addEventListener('click', () => document.body.classList.toggle('sb-open'));
  $('#sb-overlay').addEventListener('click', () => document.body.classList.remove('sb-open'));
  $('#tb-avatar').addEventListener('click', () => go(S.admin ? 'a_password' : 'me'));
  document.addEventListener('keydown', e => { if (e.key === 'Escape') document.body.classList.remove('sb-open'); });
  if (gs && gs.history) {
    try { gs.history.setChangeHandler(ev => { const v = ev && ev.state && ev.state.view; if (v && S.started && VIEWS[v]) go(v, {}, { fromHistory: true }); }); } catch (e) { /* ignore */ }
  }
  if (!frameAllowed()) { renderBlocked(); return; }
  pwaPost({ type: 'hello', theme: S.pub.primary, name: S.pub.siteName });
  applyPublicBranding();
  net();
  const mode = BOOT.mode;
  if (mode === 'fatal') { renderFatal(BOOT.error); return; }
  if (mode === 'reset') { renderReset(); return; }
  if (mode === 'share') { renderShare(); return; }
  if (mode === 'google_complete') { renderGoogleComplete(); return; }
  if (mode === 'app' && BOOT.session && BOOT.boot) { clearUrl(); onLoggedIn({ session: BOOT.session, boot: BOOT.boot }, { via: 'google', remember: BOOT.session.remember }); toast('เข้าสู่ระบบด้วย Google แล้ว', { type: 'ok' }); return; }
  if (mode === 'admin') { renderAdminLogin(); return; }
  if (BOOT.error) { clearUrl(); renderLogin({ type: 'warn', text: BOOT.error }); return; }
  tryResume().then(resumed => { if (!resumed) renderLogin(); }).catch(() => renderLogin());
}
async function bootPwa() {
  const q = new URLSearchParams(location.search);
  const view = (q.get('view') || '').replace(/[^a-z_]/g, '').slice(0, 20);
  if (location.search) { try { history.replaceState(null, '', location.pathname + (view ? '#' + view : location.hash)); } catch (e) { /* ไม่เป็นไร */ } }
  try {
    if (q.get('code') && q.get('state')) Object.assign(BOOT, await api('googleCallback', { code: q.get('code'), state: q.get('state') }));
    else if (q.get('error') && q.get('state')) Object.assign(BOOT, { mode: 'login', error: 'ยกเลิกการเข้าสู่ระบบด้วย Google แล้ว' });
    else if (q.get('reset')) Object.assign(BOOT, { mode: 'reset', resetToken: q.get('reset').slice(0, 128) });
    else if (q.get('share')) Object.assign(BOOT, { mode: 'share', shareToken: q.get('share').slice(0, 128) });
    else if (q.get('admin')) BOOT.mode = 'admin';
    BOOT.publicInfo = await api('publicInfo');
  } catch (e) {
    BOOT.mode = 'fatal';
    BOOT.error = navigator.onLine === false ? 'ยังไม่มีการเชื่อมต่ออินเทอร์เน็ต ข้อมูลของคุณเก็บไว้ในระบบอย่างปลอดภัย เมื่อเชื่อมต่อแล้วแอปจะเปิดต่อให้เอง'
      : e && e.code === 'SERVER_OLD' ? e.message
      : 'เชื่อมต่อระบบหลักไม่สำเร็จ กรุณาลองใหม่อีกครั้ง (ผู้ดูแล: ตรวจว่า Deploy แบบ Who has access: Anyone และระบบเป็นเวอร์ชัน 1.1.0 ขึ้นไป)';
    window.addEventListener('online', () => location.reload());
  }
  S.pub = BOOT.publicInfo || S.pub || {};
  window.addEventListener('popstate', ev => { const v = ev.state && ev.state.view; if (v && S.started && VIEWS[v]) go(v, {}, { fromHistory: true }); });
}
function start() { if (PWA_APP) bootPwa().then(init, init); else init(); }
if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', start); else start();
})();

</script>
